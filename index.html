<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff7fa">
<title>Для Кати ❤️</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:#fff7fa;color:#5d3548;
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden
}
section{
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:34px 20px;position:relative;overflow:hidden
}
.box{width:min(700px,100%);position:relative;z-index:2}
.intro{background:
 radial-gradient(circle at 15% 20%,rgba(234,143,169,.20),transparent 30%),
 radial-gradient(circle at 85% 75%,rgba(197,123,154,.18),transparent 30%)}
.small{text-transform:uppercase;letter-spacing:5px;font:14px Arial,sans-serif;color:#b47791;margin-bottom:22px;opacity:0;animation:up 1.2s .2s forwards}
h1{font-size:clamp(46px,12vw,88px);line-height:.95;font-weight:500;margin:0;color:#7e3656;opacity:0;animation:up 1.4s .6s forwards}
.subtitle{font-size:clamp(23px,6vw,38px);line-height:1.25;margin:28px 0 0;opacity:0;animation:up 1.4s 1.1s forwards}
button{
  border:0;border-radius:999px;background:#b85f82;color:#fff;
  font:bold 17px Arial,sans-serif;padding:17px 31px;cursor:pointer;
  box-shadow:0 12px 30px rgba(184,95,130,.28)
}
.start{margin-top:40px;opacity:0;animation:up 1.3s 1.7s forwards}
.letter{background:linear-gradient(180deg,#fff7fa,#fff0f5)}
.paper{
  background:rgba(255,255,255,.82);border-radius:28px;padding:32px 24px;
  box-shadow:0 18px 60px rgba(120,55,80,.12);border:1px solid rgba(184,95,130,.12)
}
.paper h2{font-size:clamp(32px,8vw,52px);font-weight:500;margin:0 0 24px}
.paper p{font-size:clamp(21px,5.5vw,29px);line-height:1.55;margin:0}
.photos{display:grid;gap:22px;margin-top:28px}
.photo{
 width:100%;max-height:65vh;object-fit:cover;border-radius:28px;
 box-shadow:0 15px 40px rgba(80,30,50,.16);
 opacity:0;transform:translateY(25px);animation:up 1s forwards
}
.photo:nth-child(2){animation-delay:.25s}
.photo:nth-child(3){animation-delay:.5s}
.final{background:
 radial-gradient(circle at 50% 45%,rgba(224,126,157,.25),transparent 48%),#fff7fa}
.final h2{font-size:clamp(42px,11vw,78px);line-height:1.05;font-weight:500;color:#873653;margin:0}
.final p{font-size:20px;margin-top:22px}
.heart{font-size:58px;animation:beat 1.5s infinite}
.music{
 position:fixed;right:14px;bottom:14px;z-index:20;
 padding:12px 17px;font-size:14px;background:#7e3656
}
.note{font:13px Arial,sans-serif;color:#9b7081;margin-top:18px}
@keyframes up{to{opacity:1;transform:translateY(0)}}
@keyframes beat{50%{transform:scale(1.18)}}
</style>
</head>
<body>

<audio id="music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<section class="intro">
 <div class="box">
  <div class="small">маленький подарок</div>
  <h1>Катя</h1>
  <div class="subtitle">У меня для тебя кое-что есть... ❤️</div>
  <button class="start" onclick="openGift()">Открыть послание ↓</button>
 </div>
</section>

<section class="letter">
 <div class="box">
  <div class="paper">
   <h2>Письмо от меня 💌</h2>
   <p>Всё связанное с любовью в этом мире — это ты.</p>
   <div class="photos">
    <img class="photo" src="photo1.jpg" alt="Фото Кати">
    <img class="photo" src="photo2.jpg" alt="Фото Кати">
    <img class="photo" src="photo3.jpg" alt="Фото Кати">
   </div>
  </div>
 </div>
</section>

<section class="final">
 <div class="box">
   <div class="heart">❤️</div>
   <h2>Люблю тебя,<br>Катюша</h2>
   <p>Очень сильно. И это всё — для тебя.</p>
 </div>
</section>

<button class="music" onclick="toggleMusic()">♫ Музыка</button>

<script>
const music=document.getElementById('music');
function openGift(){
  music.play().catch(()=>{});
  document.querySelector('.letter').scrollIntoView({behavior:'smooth'});
}
function toggleMusic(){
  if(music.paused) music.play().catch(()=>{});
  else music.pause();
}
</script>
</body>
</html>
