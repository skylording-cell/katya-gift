<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Для Кати ❤️</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:#fff7fa;
  color:#60394c;
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden
}
section{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 22px;
  position:relative;
  overflow:hidden
}
.box{max-width:700px;width:100%;position:relative;z-index:2}

.intro{
  background:
  radial-gradient(circle at 15% 20%,#e4aec422,transparent 30%),
  radial-gradient(circle at 85% 80%,#c9789822,transparent 30%),
  #fff7fa
}

.small{
  text-transform:uppercase;
  letter-spacing:5px;
  color:#b47791;
  font:14px Arial,sans-serif;
  opacity:0;
  animation:up 1.2s .2s forwards
}

h1{
  font-size:clamp(43px,12vw,88px);
  line-height:.98;
  font-weight:500;
  margin:22px 0;
  color:#713e56;
  opacity:0;
  animation:up 1.4s .6s forwards
}

.sub{
  font-size:clamp(23px,6vw,38px);
  opacity:0;
  animation:up 1.4s 1.1s forwards
}

button,.btn{
  display:inline-block;
  margin-top:38px;
  padding:17px 31px;
  border:0;
  border-radius:50px;
  background:#b85f82;
  color:white;
  font:bold 17px Arial,sans-serif;
  text-decoration:none;
  box-shadow:0 12px 30px #8b466322;
  cursor:pointer;
  opacity:0;
  animation:up 1.3s 1.7s forwards
}

.letter{
  background:linear-gradient(#fff7fa,#fff0f5)
}

.paper{
  background:#ffffffb8;
  border:1px solid #b5688525;
  border-radius:28px;
  padding:38px 25px;
  box-shadow:0 20px 60px #74304f12
}

h2{
  font-size:clamp(32px,8vw,52px);
  font-weight:500;
  margin:0 0 25px
}

.message{
  font-size:clamp(21px,5.5vw,30px);
  line-height:1.6;
  margin:0
}

.final{
  background:
  radial-gradient(circle at center,#c4678928,transparent 48%),
  linear-gradient(#fff3f7,#ffe8f0)
}

.final h2{
  font-size:clamp(45px,12vw,92px);
  line-height:1.05;
  color:#71364f;
  opacity:0;
  animation:up 1.7s .6s forwards
}

.final p{
  font:16px Arial,sans-serif;
  color:#9a647b;
  opacity:0;
  animation:up 1.4s 1.4s forwards
}

.heart{
  position:absolute;
  color:#b85f8230;
  font-size:30px;
  animation:float 6s ease-in-out infinite
}
.a{left:8%;top:15%}
.b{right:10%;top:30%;animation-delay:1s}
.c{left:18%;bottom:18%;animation-delay:2s}
.d{right:17%;bottom:12%;animation-delay:3s}

.music{
  position:fixed;
  z-index:10;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(330px,calc(100% - 30px))
}

audio{width:100%;height:38px}

@keyframes up{
  from{opacity:0;transform:translateY(25px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(-8deg)}
  50%{transform:translateY(-25px) rotate(8deg)}
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<section class="intro">
  <span class="heart a">♥</span>
  <span class="heart b">♥</span>
  <span class="heart c">♥</span>
  <span class="heart d">♥</span>

  <div class="box">
    <div class="small">Маленький подарок</div>

    <h1>У меня для тебя<br>кое-что есть...</h1>

    <div class="sub">Для моей любимой ❤️</div>

    <a class="btn" href="#letter" onclick="playMusic()">
      Открыть послание ↓
    </a>
  </div>
</section>

<section class="letter" id="letter">
  <div class="box paper">
    <h2>Письмо от меня</h2>

    <p class="message">
      Всё связанное с любовью<br>
      в этом мире — это ты. ❤️
    </p>

    <a class="btn" href="#final" onclick="playMusic()">
      Дальше ↓
    </a>
  </div>
</section>

<section class="final" id="final">
  <div class="box">
    <div class="small">И это главное</div>

    <h2>
      Люблю тебя,<br>
      Катюша ❤️
    </h2>

    <p>Навсегда и очень сильно.</p>
  </div>
</section>

<div class="music">
  <audio controls loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
function playMusic(){
  document.getElementById("music").play().catch(()=>{});
}
</script>

</body>
</html>
