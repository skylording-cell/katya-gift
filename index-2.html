<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7fa">
  <title>Для Кати ❤️</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      background: #fff7fa;
      color: #5d3548;
    }

    body {
      overflow-x: hidden;
    }

    .screen {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 22px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .content {
      width: min(680px, 100%);
      position: relative;
      z-index: 2;
    }

    .intro {
      background:
        radial-gradient(circle at 20% 20%, rgba(214,143,169,.15), transparent 28%),
        radial-gradient(circle at 85% 75%, rgba(183,93,128,.12), transparent 30%),
        #fff7fa;
    }

    .small {
      text-transform: uppercase;
      letter-spacing: 5px;
      font-size: 14px;
      color: #b47791;
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeUp 1.3s .3s forwards;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 12vw, 88px);
      line-height: .95;
      font-weight: 500;
      color: #6e3d55;
      opacity: 0;
      animation: fadeUp 1.5s .7s forwards;
    }

    .subtitle {
      margin: 28px 0 0;
      font-size: clamp(23px, 6vw, 38px);
      line-height: 1.25;
      opacity: 0;
      animation: fadeUp 1.5s 1.2s forwards;
    }

    .heart {
      display: inline-block;
      animation: heartbeat 1.5s 2.3s infinite;
    }

    .button {
      display: inline-block;
      margin-top: 42px;
      padding: 17px 30px;
      border-radius: 999px;
      background: #b85f82;
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-weight: 700;
      font-size: 17px;
      box-shadow: 0 12px 30px rgba(130, 55, 85, .18);
      opacity: 0;
      animation: fadeUp 1.4s 1.8s forwards;
      transition: transform .25s, box-shadow .25s;
    }

    .button:active {
      transform: scale(.97);
    }

    .letter {
      background: linear-gradient(#fff7fa, #fff0f5);
    }

    .paper {
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(181,104,133,.16);
      border-radius: 28px;
      padding: 34px 25px;
      box-shadow: 0 20px 60px rgba(116,48,79,.08);
    }

    .paper h2 {
      font-size: clamp(31px, 8vw, 48px);
      margin: 0 0 25px;
      font-weight: 500;
    }

    .paper p {
      font-size: clamp(21px, 5.5vw, 29px);
      line-height: 1.65;
      margin: 0;
    }

    .final {
      background:
        radial-gradient(circle at center, rgba(196,103,137,.18), transparent 45%),
        linear-gradient(#fff3f7, #ffe8f0);
    }

    .final .small { animation-delay: .2s; }

    .final h2 {
      margin: 0;
      font-size: clamp(46px, 12vw, 92px);
      line-height: 1.05;
      font-weight: 500;
      color: #71364f;
      opacity: 0;
      animation: fadeUp 1.8s .7s forwards;
    }

    .final p {
      font-family: Arial, sans-serif;
      font-size: 16px;
      color: #9a647b;
      margin-top: 28px;
      opacity: 0;
      animation: fadeUp 1.5s 1.5s forwards;
    }

    .floating-heart {
      position: absolute;
      color: rgba(184,95,130,.22);
      font-size: 28px;
      animation: float 7s ease-in-out infinite;
      user-select: none;
    }

    .h1 { left: 8%; top: 15%; animation-delay: 0s; }
    .h2 { right: 9%; top: 28%; animation-delay: 1.5s; }
    .h3 { left: 18%; bottom: 18%; animation-delay: 3s; }
    .h4 { right: 18%; bottom: 12%; animation-delay: 2s; }

    .music {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 20;
      width: min(330px, calc(100% - 32px));
      opacity: .9;
    }

    audio {
      width: 100%;
      height: 38px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.2); }
      30% { transform: scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-25px) rotate(8deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .small, h1, .subtitle, .button, .final h2, .final p { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Музыка: положи рядом с index.html файл music.mp3 -->
  <audio id="music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <main>
    <section class="screen intro">
      <span class="floating-heart h1">♥</span>
      <span class="floating-heart h2">♥</span>
      <span class="floating-heart h3">♥</span>
      <span class="floating-heart h4">♥</span>

      <div class="content">
        <div class="small">Маленький сюрприз</div>
        <h1>У меня для тебя<br>кое-что есть...</h1>
        <div class="subtitle">Для самой особенной ❤️</div>
        <a class="button" href="#letter" id="start">Открыть послание ↓</a>
      </div>
    </section>

    <section class="screen letter" id="letter">
      <div class="content paper">
        <h2>Письмо от меня</h2>
        <p>
          Всё связанное с любовью<br>
          в этом мире — это ты. ❤️
        </p>
        <a class="button" href="#final">Дальше ↓</a>
      </div>
    </section>

    <section class="screen final" id="final">
      <div class="content">
        <div class="small">И это главное</div>
        <h2>Люблю тебя,<br>Катюша ❤️</h2>
        <p>Навсегда и очень сильно.</p>
      </div>
    </section>
  </main>

  <div class="music">
    <audio id="player" controls loop>
      <source src="music.mp3" type="audio/mpeg">
      Твой браузер не поддерживает аудио.
    </audio>
  </div>

  <script>
    const music = document.getElementById('music');
    const start = document.getElementById('start');

    // На телефонах автозапуск музыки часто блокируется.
    // После первого нажатия на кнопку пытаемся включить её.
    start.addEventListener('click', () => {
      music.play().catch(() => {});
    });
  </script>
</body>
</html>
